#VRML_SIM R2023b utf8
# Model robin on a perch built from Webots shapes (CIFAR-10 class "bird").

PROTO ModelBird [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "bird"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF POST Pose {
        translation 0 0 0.016
        children [
          Shape {
            appearance DEF BARK PBRAppearance { baseColor 0.36 0.26 0.17 roughness 0.9 metalness 0 }
            geometry Cylinder { height 0.032 radius 0.006 }
          }
        ]
      }
      DEF BRANCH Pose {
        translation 0 0 0.037
        rotation 0 1 0 1.5708
        children [
          Shape {
            appearance USE BARK
            geometry Cylinder { height 0.16 radius 0.008 }
          }
        ]
      }
      DEF LEG_LEFT Pose {
        translation 0.005 0.014 0.058
        children [
          DEF LEG Shape {
            appearance PBRAppearance { baseColor 0.3 0.24 0.2 roughness 0.8 metalness 0 }
            geometry Cylinder { height 0.036 radius 0.0028 }
          }
        ]
      }
      DEF LEG_RIGHT Pose {
        translation 0.005 -0.014 0.058
        children [ USE LEG ]
      }
      DEF TAIL Pose {
        translation -0.088 0 0.098
        rotation 0 1 0 -0.35
        children [
          Shape {
            appearance DEF WING_BROWN PBRAppearance { baseColor 0.3 0.21 0.13 roughness 0.85 metalness 0 }
            geometry Box { size 0.075 0.042 0.008 }
          }
        ]
      }
      DEF BODY Transform {
        translation 0 0 0.104
        scale 1.5 1 1.05
        children [
          Shape {
            appearance DEF FEATHER_BROWN PBRAppearance { baseColor 0.46 0.33 0.21 roughness 0.85 metalness 0 }
            geometry Sphere { radius 0.04 subdivision 3 }
          }
        ]
      }
      DEF BREAST Transform {
        translation 0.03 0 0.095
        scale 1 0.95 1.05
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.8 0.5 0.26 roughness 0.85 metalness 0 }
            geometry Sphere { radius 0.033 subdivision 3 }
          }
        ]
      }
      DEF WING_LEFT Transform {
        translation -0.012 0.036 0.108
        rotation 0 1 0 -0.2
        scale 1.7 0.3 0.85
        children [
          DEF WING Shape {
            appearance USE WING_BROWN
            geometry Sphere { radius 0.036 subdivision 3 }
          }
        ]
      }
      DEF WING_RIGHT Transform {
        translation -0.012 -0.036 0.108
        rotation 0 1 0 -0.2
        scale 1.7 0.3 0.85
        children [ USE WING ]
      }
      DEF HEAD Pose {
        translation 0.066 0 0.142
        children [
          Shape {
            appearance USE FEATHER_BROWN
            geometry Sphere { radius 0.029 subdivision 3 }
          }
        ]
      }
      DEF BEAK Pose {
        translation 0.104 0 0.139
        rotation 0 1 0 1.5708
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.85 0.62 0.2 roughness 0.6 metalness 0 }
            geometry Cone { bottomRadius 0.009 height 0.026 }
          }
        ]
      }
      DEF EYE_LEFT Pose {
        translation 0.086 0.021 0.149
        children [
          DEF EYE Shape {
            appearance PBRAppearance { baseColor 0.03 0.03 0.03 roughness 0.2 metalness 0 }
            geometry Sphere { radius 0.005 subdivision 2 }
          }
        ]
      }
      DEF EYE_RIGHT Pose {
        translation 0.086 -0.021 0.149
        children [ USE EYE ]
      }
    ]
    boundingObject Pose {
      translation 0 0 0.086
      children [
        Box { size 0.2 0.16 0.172 }
      ]
    }
  }
}
